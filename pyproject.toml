[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanakh-explorer"
version = "1.0.0"
description = "Research system for the Hebrew Bible: acrostics, skips, niqqud, gematria and letter transformations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code); Bible text CC BY-SA 4.0, downloaded at setup" }
dependencies = ["numpy>=2.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
tanakh-explorer = "tanakh_explorer.__main__:main"

[tool.setuptools.packages.find]
include = ["tanakh_explorer*"]

[tool.setuptools.package-data]
tanakh_explorer = ["frontend/*", "frontend/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
